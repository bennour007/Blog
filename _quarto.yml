project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/**/*.qmd"
    - "projects/**/*.qmd"
    - "research/**/*.qmd"
    - "cv/**/*.qmd"
  resources:
    - "files/"

website:
  title: "B.M.H."
  site-url: https://www.bennour.xyz
  description: "Learning, reading, writing, and coding everyday"
  open-graph: true
  navbar:
    left:
      - text: Research
        href: research/index.qmd
      - text: Projects
        href: projects/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: CV
        href: cv/index.qmd
    right:
      - icon: github
        href: https://github.com/bennour007
      - icon: linkedin
        href: https://www.linkedin.com/in/bennour-medhsin/
      - icon: rss
        href: blog/index.xml

format:
  html:
    theme: [cosmo, brand.scss]
    highlight-style: monochrome
    css: styles.css
    toc: false
    code-copy: true            # copy button on code blocks
    code-overflow: scroll      # long lines scroll instead of wrapping
    fig-width: 8               # default R/Python figure size, in inches
    fig-height: 5
    fig-align: center

execute:
  freeze: auto

language:
  listing-page-minutes-compact: "{0} min read"

